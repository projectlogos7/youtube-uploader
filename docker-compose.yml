# Start with ./start.sh (this computer only) or ./start.sh --wifi (your whole network).
services:
  uploader:
    build: .
    container_name: media-uploader
    restart: unless-stopped
    user: "${UID_GID:-1000:1000}"                  # run as you, so it can move your files
    ports:
      - "${LISTEN_ON:-127.0.0.1}:8765:8765"
    volumes:
      - "${HOME}:${HOME}"                           # lets the web app pick a watch folder in your home folder
      - uploader-data:/data                         # settings, sign-ins, history, files from other computers
    environment:
      HOST_HOME: "${HOME}"
      LAN_ACCESS: "${LAN_ACCESS:-0}"
      SERVER_URL: "${SERVER_URL:-}"

volumes:
  uploader-data:
