[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studio-uploader"
version = "0.1.0"
description = "Gated, private-only uploader for the studio YouTube channel"
requires-python = ">=3.11"
# Deliberately no runtime dependencies: standard library only, to keep the
# code that touches the channel credential small and auditable.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
studio-uploader = "studio_uploader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
